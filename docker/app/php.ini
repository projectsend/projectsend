; App uploads are direct-to-storage in production (brief §3); these limits only
; cover metadata requests and local-dev fallbacks.
upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 256M

opcache.enable = 1
opcache.validate_timestamps = 1

; No X-Powered-By header — the PHP version is nobody's business but ours.
expose_php = Off
