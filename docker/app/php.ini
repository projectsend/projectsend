; App uploads are direct-to-storage in production (brief §3); these limits only
; cover metadata requests and local-dev fallbacks.
upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 256M

opcache.enable = 1
opcache.validate_timestamps = 1

; No X-Powered-By header — the PHP version is nobody's business but ours.
expose_php = Off

; Laravel keeps its own sessions and never uses PHP's, so PHP's upload
; progress tracking has nothing to do here. Left on, it lets any upload
; request write into PHP's session files, which is the path CVE-2026-126714
; and CVE-2026-115560 take. Off removes that path on any PHP version.
session.upload_progress.enabled = Off
