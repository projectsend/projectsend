; Overrides only — loaded after the base image's www.conf/docker.conf (see
; /usr/local/etc/php-fpm.d/*.conf) thanks to the zz- prefix it's copied
; under, same convention the base image itself uses for docker.conf vs
; zz-docker.conf. Stock pm.max_children=5 is a "container boots" number,
; not a "handles concurrent users" number, and nothing else here caps how
; much RAM the pool can claim on a shared VPS.
[www]
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500
